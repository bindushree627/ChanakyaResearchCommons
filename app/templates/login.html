{% extends "base.html" %}
{% block title %}Sign In — Chanakya Research Commons{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="academic-card p-4 p-md-5 shadow">
        <div class="text-center mb-4">
          <span class="brand-crest mb-2" style="width: 44px; height: 44px; font-size: 1.4rem;">C</span>
          <h4 class="fw-bold mb-1">Chanakya Research Portal</h4>
          <p class="text-muted small">Sign in with your university credentials</p>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Username or University Email</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
              <input type="text" name="identifier" class="form-control" placeholder="username or user@chanakya.ac.in" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mb-3">
            Sign In
          </button>

          <div class="text-center small">
            <span class="text-muted">New researcher at Chanakya? </span>
            <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none">Create an Account</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
