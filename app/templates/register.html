{% extends "base.html" %}
{% block title %}Register — Chanakya Research Commons{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="academic-card p-4 p-md-5 shadow">
        <div class="text-center mb-4">
          <span class="brand-crest mb-2" style="width: 44px; height: 44px; font-size: 1.4rem;">C</span>
          <h4 class="fw-bold mb-1">Create Researcher Account</h4>
          <p class="text-muted small">Join Chanakya University's scholarly research commons</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name *</label>
            <input type="text" name="full_name" class="form-control" placeholder="Prof. / Dr. / Ms. / Mr." required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Username *</label>
              <input type="text" name="username" class="form-control" placeholder="e.g. arjun.rao" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">University Email *</label>
              <input type="email" name="email" class="form-control" placeholder="name@chanakya.ac.in" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Password *</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Academic Role *</label>
              <select name="role" class="form-select">
                <option value="Student">Student (B.Tech / M.Tech)</option>
                <option value="Researcher">Researcher (Ph.D / PostDoc)</option>
                <option value="Faculty">Faculty Member</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Department *</label>
              <select name="department_id" class="form-select">
                <option value="">Select Department</option>
                {% for d in departments %}
                <option value="{{ d.id }}">{{ d.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Research Interests (Comma separated)</label>
            <input type="text" name="interests" class="form-control" placeholder="e.g. Deep Learning, Data Mining, Robotics">
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Short Bio</label>
            <textarea name="bio" rows="2" class="form-control" placeholder="Your research focus, lab affiliation, or thesis topic..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mb-3">
            Complete Registration
          </button>

          <div class="text-center small">
            <span class="text-muted">Already registered? </span>
            <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
